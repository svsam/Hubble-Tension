; Project pipeline based on the supplied Standard Library example
; examples/pantheon_plus_shoes.ini. It fits a flat Lambda-CDM background to
; Pantheon+ supernova distances and the included SH0ES absolute calibration.
[runtime]
sampler = emcee
; This project sits one directory below the installed Standard Library.
root = ${PWD}/..
; Start a fresh chain each run instead of appending to a previous run.
resume = F
verbosity = standard

[emcee]
; Educational chain settings: 300 iterations, recorded in chunks of 10.
; The resulting chain has 300 x 8 = 2,400 walker rows, not a precision run.
walkers = 8
samples = 300
nsteps = 10

[output]
; Save a readable CosmoSIS text chain inside this project.
filename = ${PWD}/output/pantheon_plus_shoes_chain.txt
format = text

[pipeline]
; consistency supplies derived parameters, astropy computes background
; distances, and pantheon_plus evaluates the supernova likelihood.
modules = consistency astropy pantheon_plus
values = ${PWD}/values.ini
; Retain Omega_Lambda as a consistency check in the text-chain output.
extra_output = cosmological_parameters/omega_lambda
debug = F
timing = F

[test]
; Destination for optional CosmoSIS pipeline diagnostic output.
save_dir = output/pipeline_test

[consistency]
; Standard Library helper for derived cosmological parameters.
file = utility/consistency/consistency_interface.py

[astropy]
file = background/astropy_background/astropy_background.py
; FlatLambdaCDM fixes curvature to zero and dark-energy equation of state to -1.
; This background-only calculator is sufficient for the supernova distance fit;
; it is not a CMB calculation and does not reproduce Planck's inference.
model = flatlambdacdm
nz = 300
zmax = 3.0

[pantheon_plus]
file = likelihood/pantheon_plus/pantheon_plus_shoes.py
likelihood_only = T
; Include the SH0ES calibration so the supernova absolute-magnitude/expansion-
; scale degeneracy is anchored and an absolute H0 posterior can be inferred.
include_shoes = T
