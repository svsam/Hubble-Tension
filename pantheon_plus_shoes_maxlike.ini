; Deterministic maximum-likelihood fit to the same Pantheon+SH0ES data,
; background model, parameter ranges, and likelihood as pantheon_plus_shoes.ini.
[runtime]
sampler = maxlike
root = ${PWD}/..
verbosity = standard

[maxlike]
; L-BFGS-B optimizes the likelihood within the parameter bounds. Its
; inverse-Hessian approximation is saved for local 1-sigma error estimates.
method = BFGS
tolerance = 1e-7
maxiter = 2000
output_covmat = ${PWD}/output/pantheon_plus_shoes_maxlike_covmat.txt
output_ini = ${PWD}/output/pantheon_plus_shoes_maxlike_bestfit.ini

[output]
filename = ${PWD}/output/pantheon_plus_shoes_maxlike.txt
format = text

[pipeline]
modules = consistency astropy pantheon_plus
values = ${PWD}/values.ini
extra_output = cosmological_parameters/omega_lambda
debug = F
timing = F

[consistency]
file = utility/consistency/consistency_interface.py

[astropy]
file = background/astropy_background/astropy_background.py
model = flatlambdacdm
nz = 300
zmax = 3.0

[pantheon_plus]
file = likelihood/pantheon_plus/pantheon_plus_shoes.py
likelihood_only = T
include_shoes = T
