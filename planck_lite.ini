; Separate Planck 2018 compressed-likelihood run for an independent CMB
; comparison with the Pantheon+SH0ES distance-ladder chain.
[runtime]
sampler = emcee
root = ${PWD}/..
resume = F
verbosity = standard

[emcee]
; Educational settings; increase samples and assess convergence for science use.
walkers = 12
samples = 30
nsteps = 10

[output]
filename = ${PWD}/output/planck_lite_chain.txt
format = text

[pipeline]
modules = consistency camb planck
values = ${PWD}/planck_values.ini
priors = ${PWD}/planck_priors.ini
debug = F
timing = F

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = cmb
lmax = 2800
feedback = 1
AccuracyBoost = 1.1
do_tensors = F
do_lensing = T
NonLinear = lens
accurate_massive_neutrino_transfers = F

[planck]
; CosmoSIS Standard Library's compressed Planck 2018 TT,TE,EE likelihood.
file = likelihood/planck_py/planck_py_interface.py
year = 2018
spectra = TTTEEE
use_low_ell_bins = T
