[cosmological_parameters]
; In CosmoSIS values files, each sampled parameter is written as
; lower bound, starting value, upper bound. The bounds define uniform priors.
; h is the dimensionless Hubble parameter; convert samples with H0 = 100 h.
omega_m = 0.1  0.3  0.5
h0      = 0.6  0.7  0.8

; Fixed model choices: spatial flatness and Lambda (w = -1).
omega_k = 0.0
w       = -1.0

; Kept as fixed compatibility inputs for the pipeline. The configured Astropy
; background module uses H0 and Omega_m; no CMB likelihood is included here.
omega_b = 0.04
A_s     = 2.0e-9
n_s     = 1.0
tau     = 0.08

[supernova_params]
; Pantheon+ absolute-magnitude nuisance parameter. The SH0ES calibration helps
; anchor this magnitude and break the supernova-only absolute-scale degeneracy.
; Prior is uniform on [-21, -18], with -19.35 as the starting point.
m = -21.0  -19.35  -18.0
